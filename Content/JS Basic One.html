<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title> JavaScript — Basic One</title>
  <style> input, p {border-radius:4px; background:dodgerblue;color:white;padding:4px;text-align:center;} </style>
</head>
<body>
<h1>មូលដ្ឋានបឋមនៃ JavaScript</h1>
<h2>ថែម JavaScript</h2>
<h3>1. inline script</h3>
<input onclick="alert('សារសរសេរដោយសរសេរស្រ្គីបក្នុងស្លាកបើកនៃធាតុ')"   value="សារជូនដំណឹង!">
<h3>2. internal script</h3>
<p id="is"> . . . </p>
<script>document.getElementById("is").innerText="ខ្លឹមសារធាតុ p ត្រូវបានថែមដោយ internal script."</script>


<h3>3. External scriptt</h3>
<p id="es"> . . . </p>
<script src="../script/external.js"></script>


</body>
</html>
